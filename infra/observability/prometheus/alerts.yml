# Alertas como código (ADR-015). Avaliados pelo Prometheus e visíveis em /alerts e no Grafana;
# sem envio (Alertmanager) até existir um destino real. Cada alerta diz o que olhar primeiro.
groups:
  - name: orderflow
    rules:
      - alert: OrderflowDependencyDown
        expr: orderflow_dependency_up == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.dependency }} indisponível para a API"
          runbook: "GET /health/ready; broker indisponível com conexão ok = alarme de disco/memória do RabbitMQ (docs/development/local-development.md)."

      - alert: OrderflowHighErrorRate
        expr: |
          (sum(rate(django_http_responses_total_by_status_total{status=~"5.."}[5m])) or vector(0))
            / clamp_min(sum(rate(django_http_responses_total_by_status_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Mais de 5% das respostas da API são 5xx"
          runbook: "Logs com event=api.unhandled_exception; o request_id da resposta leva ao trace."

      - alert: OrderflowSlowRequests
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(django_http_requests_latency_seconds_by_view_method_bucket{view!~"health-.*|metrics"}[5m]))) > 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "p95 de latência da API acima de 1 s"
          runbook: "Painel 'Latência p95 por rota' e traces lentos no Jaeger (consultas no banco)."

      - alert: OrderflowOutboxLagging
        expr: orderflow_outbox_pending{measure="oldest_age_seconds"} > 120
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Eventos do outbox esperando há mais de 2 min"
          runbook: "Beat (events.relay_outbox) parado ou broker bloqueado; pedidos não viram e-mail/estorno/auditoria."

      - alert: OrderflowCeleryTaskFailures
        expr: sum by (task) (increase(orderflow_celery_tasks_total{outcome="failed"}[15m])) > 5
        labels: {severity: warning}
        annotations:
          summary: "Task {{ $labels.task }} falhando repetidamente"
          runbook: "Logs do worker filtrados por task_name; correlation_id leva à requisição de origem."

      - alert: OrderflowEmailsFailing
        expr: sum(increase(orderflow_notifications_send_total{outcome="failed"}[30m])) > 0
        labels: {severity: warning}
        annotations:
          summary: "E-mails esgotaram as tentativas de envio"
          runbook: "Histórico 'Avisos ao cliente' do pedido; last_error traz o tipo do erro do SMTP."

      - alert: OrderflowPaymentsStuck
        expr: orderflow_payments_awaiting_reconciliation > 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Cobranças de cartão sem resposta do provedor há 30 min"
          runbook: "Reconciliação (maintenance.reconcile_pending_payments) e disponibilidade do gateway."

      - alert: OrderflowStockContention
        expr: sum(increase(orderflow_stock_busy_total[10m])) > 10
        labels: {severity: warning}
        annotations:
          summary: "Muitas reservas recusadas por disputa de estoque (STOCK_BUSY)"
          runbook: "Produto muito disputado ou transação longa segurando lock (ADR-008)."
