# OrderFlow — ambiente local (ADR-010).
# Compose = runtime e infraestrutura. Tarefas de engenharia (lint/test/build) ficam no Moonrepo.
#
# Funciona sem `.env`: todos os valores têm defaults seguros apenas para desenvolvimento local.
# Copie `.env.example` para `.env` para ajustar portas e credenciais.

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.local
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-insecure-secret-key-change-me-0123456789}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  DATABASE_URL: postgres://${POSTGRES_USER:-orderflow}:${POSTGRES_PASSWORD:-orderflow}@postgres:5432/${POSTGRES_DB:-orderflow}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-orderflow}:${RABBITMQ_PASSWORD:-orderflow}@rabbitmq:5672//
  CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_HOST_PORT:-5173}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-console}
  # E-mails vão para o Mailpit (caixa de entrada em http://localhost:8025).
  EMAIL_HOST: mailpit
  EMAIL_PORT: 1025
  FRONTEND_URL: http://localhost:${FRONTEND_HOST_PORT:-5173}
  # Observabilidade (ADR-015). Prontidão consulta os alarmes do RabbitMQ (disco/memória).
  RABBITMQ_MANAGEMENT_URL: http://${RABBITMQ_USER:-orderflow}:${RABBITMQ_PASSWORD:-orderflow}@rabbitmq:15672
  # Traces vão para o Jaeger só com o perfil `observability` (ver docs/development/local-development.md).
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  ENVIRONMENT: local

x-backend-base: &backend-base
  build:
    context: .
    dockerfile: infra/docker/backend.Dockerfile
    target: dev
  image: orderflow-backend:dev
  volumes:
    - ./backend:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    mailpit:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orderflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow}
      POSTGRES_DB: ${POSTGRES_DB:-orderflow}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-orderflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-orderflow}
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  backend:
    <<: *backend-base
    command: >-
      sh -c "python manage.py migrate --noinput
      && python manage.py runserver 0.0.0.0:8000"
    environment:
      <<: *backend-env
      SERVICE_NAME: orderflow-api
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  celery-worker:
    <<: *backend-base
    # Queda transitória do broker derruba o processo; o Compose o traz de volta.
    restart: unless-stopped
    # O diretório de métricas multiprocesso precisa existir (e começar vazio) antes do worker.
    command: >-
      sh -c "rm -rf /tmp/prometheus-worker && mkdir -p /tmp/prometheus-worker
      && celery -A config worker -l INFO -Q default,notifications,integrations,maintenance"
    environment:
      <<: *backend-env
      SERVICE_NAME: orderflow-worker
      # Processos filhos (prefork) somados; o principal serve em :9100 para o Prometheus.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-worker
      WORKER_METRICS_PORT: "9100"
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  celery-beat:
    <<: *backend-base
    # Queda transitória do broker derruba o processo; o Compose o traz de volta.
    restart: unless-stopped
    # Arquivo de schedule fora do volume do código (o usuário do container não escreve em /app).
    command: celery -A config beat -l INFO --schedule /tmp/celerybeat-schedule
    environment:
      <<: *backend-env
      SERVICE_NAME: orderflow-beat

  # SMTP de desenvolvimento: recebe tudo e mostra numa caixa de entrada web. Nada sai para a internet.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "${MAILPIT_UI_HOST_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      target: dev
    image: orderflow-frontend:dev
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      # node_modules do container (instalado na imagem) não é sobrescrito pelo bind mount.
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  flower:
    profiles: ["tools"]
    <<: *backend-base
    command: celery -A config flower --port=5555
    environment:
      <<: *backend-env
    ports:
      - "${FLOWER_HOST_PORT:-5555}:5555"

  # Observabilidade local (ADR-015): `docker compose --profile observability up`.
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infra/observability/prometheus:/etc/prometheus:ro
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-orderflow-local}
      # Dev: leitura sem login; editar exige o admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/orderflow-overview.json
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    depends_on:
      - prometheus

  jaeger:
    profiles: ["observability"]
    # All-in-one em memória: recebe OTLP (4318) e mostra os traces em :16686.
    image: jaegertracing/jaeger:2.9.0
    ports:
      - "${JAEGER_UI_HOST_PORT:-16686}:16686"

volumes:
  postgres-data:
  rabbitmq-data:
